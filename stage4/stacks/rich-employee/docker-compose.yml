version: "3.9"

services:
  app:
    depends_on:
      - db
    image: hub.aiursoft.cn/aiursoft/employeecenter:latest
    volumes:
      - richemployeecenter-aspnet:/data/.aspnet/
      - richemployeecenter-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=mth;Uid=mth;Pwd=<mth_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=EmployeeCenterLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

  db:
    image: hub.aiursoft.cn/mysql
    volumes:
      - richemployeecenter-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=mth
      - MYSQL_USER=mth
      - MYSQL_PASSWORD=<mth_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  richemployeecenter-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/richemployeecenter-data/files
  richemployeecenter-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/richemployeecenter-data/aspnet
  richemployeecenter-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/richemployeecenter-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay