version: '3.9'

services:
  app:
    depends_on:
      - db
    image: hub.aiursoft.cn/aiursoft/musicexam
    volumes:
      - musicexam-aspnet:/data/.aspnet/
      - musicexam-files:/data/files
      - musicexam-import:/data/import
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=musicexam;Uid=musicexam;Pwd=<musicexam_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - DataSettings__Path=/data/import
      - AppSettings__Local__AllowRegister=false
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=MusicExamLogs
    networks:
      - internal
      - proxy_app
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: hub.aiursoft.cn/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - musicexam-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=musicexam
      - MYSQL_USER=musicexam
      - MYSQL_PASSWORD=<musicexam_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  musicexam-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/musicexam-data/files
  musicexam-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/musicexam-data/aspnet
  musicexam-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/musicexam-data/mysql
  musicexam-import:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/musicexam-data/import

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
