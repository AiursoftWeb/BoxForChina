version: '3.9'

services:
  app:
    image: hub.aiursoft.cn/ghcr.io/nextcloud-releases/aio-talk:latest
    init: true
    ports:
      - target: 3478
        published: 3478
        protocol: tcp
        mode: host
      - target: 3478
        published: 3478
        protocol: udp
        mode: host
    environment:
      - NC_DOMAIN=nextcloud.aiursoft.com
      - TALK_HOST=call.aiursoft.cn
      - TALK_PORT=3478
      - TZ=Asia/Shanghai
      - TURN_SECRET={{TURN_SECRET}}
      - SIGNALING_SECRET={{SIGNALING_SECRET}}
      - INTERNAL_SECRET={{INTERNAL_SECRET}}
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

networks:
  proxy_app:
    external: true
