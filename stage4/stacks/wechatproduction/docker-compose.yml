version: "3.9"

services:
  app:
    depends_on:
      - db
    image: hub.aiursoft.cn/aiursoft/wechatexam:latest
    volumes:
      - wechatprod-private-key:/data/private-key
      - wechatprod-aspnet:/data/.aspnet/
      - wechatprod-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=mth;Uid=mth;Pwd=<mth_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/yuefuxuetang
      - AppSettings__OIDC__ClientId={{WCE_CLIENT_ID_PROD}}
      - AppSettings__OIDC__ClientSecret={{WCE_CLIENT_SECRET_PROD}}
      - AppSettings__Wechat__AppId={{WCEXAM_APP_ID_PROD}}
      - AppSettings__Wechat__AppSecret={{WCEXAM_APP_SECRET_PROD}}
      - AppSettings__Wechat__Payment__Enabled=true
      - AppSettings__Wechat__Payment__MchId={{WCEXAM_MCH_ID_PROD}}
      - AppSettings__Wechat__Payment__CertificateSerialNumber={{WCEXAM_CERT_SERIAL_PROD}}
      - AppSettings__Wechat__Payment__V3SecretKey={{WCEXAM_V3_SECRET_KEY_PROD}}
      - AppSettings__Wechat__Payment__PrivateKeyFilePath=/data/private-key/apiclient_key.pem
      - AppSettings__Wechat__Payment__PlatformPublicKeyId={{WCEXAM_PLATFORM_PUB_KEY_ID_PROD}}
      - AppSettings__Wechat__Payment__PlatformPublicKeyFilePath=/data/private-key/pub_key.pem
      - AppSettings__Wechat__Payment__PaymentNotifyUrl=https://api.yuefuxuetang.com/api/payment/notify
      - OpenAI__CompletionApiUrl=https://ollama.aiursoft.com/api/chat
      - OpenAI__Model=aiursoft-instruct:latest
      - OpenAI__Token={{OLLAMA_GATEWAY_API_KEY}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=WeChatExamProdLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: hub.aiursoft.cn/mysql:9.7.0
    volumes:
      - wechatprod-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=mth
      - MYSQL_USER=mth
      - MYSQL_PASSWORD=<mth_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  wechatprod-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatprod-data/files
  wechatprod-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatprod-data/aspnet
  wechatprod-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatprod-data/mysql
  wechatprod-private-key:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatprod-data/private-key

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay