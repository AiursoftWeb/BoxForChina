version: "3.9"

services:
  app:
    depends_on:
      - db
    image: hub.aiursoft.cn/aiursoft/wechatexam:latest
    volumes:
      - wechatexam-private-key:/data/private-key
      - wechatexam-aspnet:/data/.aspnet/
      - wechatexam-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=mth;Uid=mth;Pwd=<mth_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/we-chat-exam
      - AppSettings__OIDC__ClientId={{WCE_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{WCE_CLIENT_SECRET}}
      - AppSettings__Wechat__AppId={{WCEXAM_APP_ID}}
      - AppSettings__Wechat__AppSecret={{WCEXAM_APP_SECRET}}
      - AppSettings__Wechat__Payment__Enabled=true
      - AppSettings__Wechat__Payment__MchId={{WCEXAM_MCH_ID}}
      - AppSettings__Wechat__Payment__CertificateSerialNumber={{WCEXAM_CERT_SERIAL}}
      - AppSettings__Wechat__Payment__V3SecretKey={{WCEXAM_V3_SECRET_KEY}}
      - AppSettings__Wechat__Payment__PrivateKeyFilePath=/data/private-key/apiclient_key.pem
      - AppSettings__Wechat__Payment__PlatformPublicKeyId={{WCEXAM_PLATFORM_PUB_KEY_ID}}
      - AppSettings__Wechat__Payment__PlatformPublicKeyFilePath=/data/private-key/pub_key.pem
      - AppSettings__Wechat__Payment__PaymentNotifyUrl=https://wechatexam.aiursoft.cn/api/payment/notify
      - OpenAI__CompletionApiUrl=https://ollama.aiursoft.com/api/chat
      - OpenAI__Model=qwen3.5:27b-q8_0
      - OpenAI__Token={{OLLAMA_GATEWAY_API_KEY}}
    networks:
      - proxy_app
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

  db:
    image: hub.aiursoft.cn/mysql
    volumes:
      - wechatexam-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=mth
      - MYSQL_USER=mth
      - MYSQL_PASSWORD=<mth_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  wechatexam-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatexam-data/files
  wechatexam-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatexam-data/aspnet
  wechatexam-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatexam-data/mysql
  wechatexam-private-key:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wechatexam-data/private-key

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay